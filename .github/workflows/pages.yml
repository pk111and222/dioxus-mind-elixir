name: Build and deploy playground to Pages

# Deploys the playground from the `release` branch: the release workflow pushes each release there
# (with the deploy key), which starts this workflow. It can also be run manually or called.
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (empty: the selected branch)"
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Branch or tag to build
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - name: Read Pages base path
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static Web/WASM bundle
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: scripts/build-pages "${PAGES_BASE_PATH:-/}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
