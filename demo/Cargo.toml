[package]
name = "mind-elixir-playground"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
web = ["dioxus/web", "dioxus-mind-elixir/web", "dep:web-sys"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { workspace = true, features = ["launch", "document"] }
dioxus-mind-elixir = { path = ".." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Element", "Location"] }

[lints]
workspace = true
