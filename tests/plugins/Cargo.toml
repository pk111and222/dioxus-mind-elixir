[package]
name = "mind-elixir-plugin-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
web = ["dioxus/web", "dioxus-mind-elixir/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { workspace = true, features = ["launch", "document"] }
dioxus-mind-elixir = { path = "../.." }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
zip = { version = "2.4.2", default-features = false }

[lints]
workspace = true
