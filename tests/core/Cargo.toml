[package]
name = "mind-elixir-core-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
web = ["dioxus/web", "dep:web-sys"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { workspace = true, features = ["launch", "document"] }
dioxus-mind-elixir = { path = "../.." }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true, features = ["Location"] }

[lints]
workspace = true
