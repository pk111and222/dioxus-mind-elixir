[package]
name = "dioxus-mind-elixir"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "A Rust-native Dioxus mind map component with CSS-variable styling"
repository = "https://github.com/pk111and222/dioxus-mind-elixir"
readme = "README.md"
documentation = "https://docs.rs/dioxus-mind-elixir"
publish = ["crates-io"]
keywords = ["dioxus", "mindmap", "wasm", "diagram", "component"]
categories = ["gui", "visualization", "wasm"]
include = ["/src/**", "/tests/foundation.rs", "/assets/**", "/docs/**", "/README.md", "/README_ZH.md", "/LICENSE", "/LICENSE-MIND-ELIXIR", "/NOTICE.md", "/CHANGELOG.md", "/Cargo.toml"]

[workspace]
members = ["demo", "tests/core", "tests/core/browser", "tests/plugins", "tests/plugins/browser"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "mounted"] }

[dependencies]
dioxus.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
zip = { version = "2.4.2", default-features = false }
base64 = "0.22"
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[features]
default = []
web = ["dioxus/web", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true, features = ["DomTokenList", "Location", "Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "CssStyleDeclaration", "HtmlCollection", "Node", "NodeList", "XmlSerializer", "Blob", "BlobPropertyBag", "Url", "FontFaceSet", "Response", "CssStyleSheet", "StyleSheetList", "CssRuleList", "CssRule", "DomRect"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

[package.metadata.docs.rs]
no-default-features = true
features = ["web"]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]
